<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Focus probe</title>
<!--
  Which signals does a phone send a page while it leaves the screen — the
  app switcher pulled part way up, Control Centre, a notification, the home
  screen? The exam screen can only cover the paper on a signal it receives,
  so this lists every one this page sees, with times, and nothing else. It
  touches no exam and sends nothing anywhere.
-->
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 14px/1.45 -apple-system, system-ui, sans-serif; background: #F7F8FA; color: #0D1B2E; }
  header { position: sticky; top: 0; background: #0A2342; color: #fff; padding: 12px 16px; }
  header h1 { margin: 0; font-size: 16px; }
  header p { margin: 4px 0 0; font-size: 12.5px; opacity: .8; }
  .bar { display: flex; gap: 8px; padding: 10px 16px; }
  button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid #C9D3E1; background: #fff; color: #0A2342; }
  ol { list-style: none; margin: 0; padding: 0 16px 40px; }
  li { padding: 6px 0; border-bottom: 1px solid #E3E8F0; font-variant-numeric: tabular-nums; }
  li b { display: inline-block; min-width: 64px; color: #5A6B82; font-weight: 600; }
  li.hit { color: #B92B1A; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Focus probe</h1>
  <p>Do the gesture (e.g. pull the app switcher up part way and let go), come back, then screenshot this list.</p>
</header>
<div class="bar"><button id="clear" type="button">Clear</button><button id="mark" type="button">Mark</button></div>
<ol id="log"></ol>
<script>
(function () {
  var t0 = performance.now();
  var list = document.getElementById('log');
  function log(text, hit) {
    var li = document.createElement('li');
    if (hit) li.className = 'hit';
    li.innerHTML = '<b>' + ((performance.now() - t0) / 1000).toFixed(2) + ' s</b> ' + text;
    list.insertBefore(li, list.firstChild);
  }
  document.getElementById('clear').onclick = function () { list.innerHTML = ''; t0 = performance.now(); log('cleared'); };
  document.getElementById('mark').onclick = function () { log('— mark —'); };

  ['blur', 'focus', 'pagehide', 'pageshow', 'resize', 'orientationchange', 'online', 'offline'].forEach(function (n) {
    window.addEventListener(n, function (e) { log('window ' + n + (e.persisted ? ' (persisted)' : ''), n === 'blur' || n === 'pagehide'); });
  });
  ['visibilitychange', 'freeze', 'resume'].forEach(function (n) {
    document.addEventListener(n, function () { log('document ' + n + ' → ' + document.visibilityState, true); });
  });
  if (window.visualViewport) visualViewport.addEventListener('resize', function () {
    log('visualViewport resize ' + Math.round(visualViewport.width) + '×' + Math.round(visualViewport.height));
  });
  ['touchcancel', 'pointercancel'].forEach(function (n) {
    document.addEventListener(n, function () { log(n, true); }, true);
  });

  // document.hasFocus(), sampled
  var focused = document.hasFocus();
  log('start: hasFocus ' + focused + ', ' + document.visibilityState);

  // A timer and the screen's frame callback, side by side. If the timer keeps
  // running while frames stop, the page is alive but not being drawn.
  var lastTimer = performance.now(), lastFrame = performance.now(), frameGapOpen = false;
  setInterval(function () {
    var now = performance.now();
    var tGap = now - lastTimer; lastTimer = now;
    if (tGap > 400) log('timer paused ' + Math.round(tGap) + ' ms', true);
    var f = document.hasFocus();
    if (f !== focused) { focused = f; log('hasFocus → ' + f, !f); }
    var fGap = now - lastFrame;
    if (fGap > 400 && !frameGapOpen) { frameGapOpen = true; log('frames stopped (timer still running)', true); }
  }, 100);
  (function frame() {
    var now = performance.now(), gap = now - lastFrame;
    if (frameGapOpen) { frameGapOpen = false; log('frames back after ' + Math.round(gap) + ' ms', true); }
    else if (gap > 400) log('frame gap ' + Math.round(gap) + ' ms', true);
    lastFrame = now;
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
